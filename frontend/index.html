<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <script>
      (function () {
        try {
          var stored = localStorage.getItem('veonotes-theme');
          var theme = stored || (window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark');
          document.documentElement.setAttribute('data-theme', theme);
        } catch (e) {}
      })();
    </script>
    <link rel="icon" type="image/png" href="/favicon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Veonotes notifies you the moment people you follow go live or post a new video on YouTube and TikTok, and lets you take timestamped, formatted notes on every video." />
    <title>Veonotes</title>
  </head>
  <body>
    <div id="root"></div>
    <noscript>
      <h1>Veonotes</h1>
      <p>Veonotes notifies you the moment people you follow go live or post a new video on YouTube and TikTok, and lets you take timestamped, formatted notes on every video. Please enable JavaScript to use the app.</p>
    </noscript>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
