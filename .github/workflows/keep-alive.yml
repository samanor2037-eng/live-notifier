name: Keep backend awake

on:
  schedule:
    # Every 10 minutes — Render free tier sleeps after ~15 minutes of no traffic.
    - cron: '*/10 * * * *'
  workflow_dispatch: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping backend health endpoint
        run: |
          curl -fsS --max-time 60 https://live-notifier-backend.onrender.com/api/health
